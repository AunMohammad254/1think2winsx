# Local Supabase stack for the end-to-end quiz test (e2e/play-quiz.spec.ts, e2e/README.md).
# Only what the quiz flow needs runs: Postgres, Auth, the REST API and its gateway
# (e2e/stack/stack.mjs starts it with every other service excluded). Its migrations are the
# db-tests/schema baseline (a copy of production), generated by that script into supabase/migrations.
# Ports are offset from Supabase's defaults so it never clashes with another local project.
project_id = "t2w-e2e"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3100"
additional_redirect_urls = ["http://localhost:3100"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 6

[auth.rate_limit]
# The test signs players and admins in many times from one address
sign_in_sign_ups = 1000
token_refresh = 1000

[auth.email]
enable_signup = true
enable_confirmations = false
