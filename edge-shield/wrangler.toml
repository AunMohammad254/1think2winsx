#:schema node_modules/wrangler/config-schema.json
# Wrangler configuration: https://developers.cloudflare.com/workers/wrangler/configuration/
#
# Every routed hostname needs a Proxied DNS record in the 1think2win.com zone. Set the secret before deploying:
#   npx wrangler secret put CRON_SECRET                 (production)
#   npx wrangler secret put CRON_SECRET --env staging   (staging)

name = "1think2win-edge"
main = "src/index.ts"
compatibility_date = "2026-10-06"
# account_id = "<id from `npx wrangler whoami`>"  # only needed if your login has several accounts
workers_dev = false
upload_source_maps = true

# www redirects to the apex (a Redirect Rule, which runs before Workers), so only the apex is routed.
# Paths Cloudflare serves from its cache, and the webhooks, get routes without this Worker (README.md).
[[routes]]
pattern = "1think2win.com/api/*"
zone_name = "1think2win.com"

[vars]
SITE_URL = "https://1think2win.com"
# "false": log-only. Limits are counted and logged ("wouldLimit" in Workers Logs), never applied
ENFORCE = "false"

[secrets]
required = ["CRON_SECRET"]

# Every minute, replacing the app's in-process self-kick of /api/cron/process-scheduled
[triggers]
crons = ["* * * * *"]

# period must be 10 or 60 seconds; namespace_id is any positive integer, unique in the account.
# Starting values: tune them with the staging load test.
# SUBMIT_LIMITER and API_LIMITER are per session (per IP without one); IP_LIMITER is a ceiling per IP,
# high enough for a carrier NAT or campus Wi-Fi full of players.
[[ratelimits]]
name = "SUBMIT_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 10 }

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1003"
simple = { limit = 3000, period = 60 }

# Hostinger's budget, per Cloudflare location (one key): 60 API requests/s, under Hostinger's ~100/s with
# room for page requests. Players in Pakistan arrive mostly through KHI, a few through LHE and MCT.
[[ratelimits]]
name = "ORIGIN_LIMITER"
namespace_id = "1004"
simple = { limit = 600, period = 10 }

[observability]
enabled = true

# Staging: vars, secrets and ratelimits are not inherited, so they are repeated here.
# Deploy with `npx wrangler deploy --env staging`.
[env.staging]
routes = [{ pattern = "staging.1think2win.com/api/*", zone_name = "1think2win.com" }]

[env.staging.vars]
SITE_URL = "https://staging.1think2win.com"
ENFORCE = "true"

# No cron until staging.1think2win.com has a DNS record: it would call a name that doesn't resolve every minute
[env.staging.triggers]
crons = []

[env.staging.secrets]
required = ["CRON_SECRET"]

[[env.staging.ratelimits]]
name = "SUBMIT_LIMITER"
namespace_id = "2001"
simple = { limit = 10, period = 10 }

[[env.staging.ratelimits]]
name = "API_LIMITER"
namespace_id = "2002"
simple = { limit = 600, period = 60 }

# k6 sends every virtual user from the load machine's one IP, so the ceiling is out of the way here
[[env.staging.ratelimits]]
name = "IP_LIMITER"
namespace_id = "2003"
simple = { limit = 200000, period = 60 }

[[env.staging.ratelimits]]
name = "ORIGIN_LIMITER"
namespace_id = "2004"
simple = { limit = 600, period = 10 }
