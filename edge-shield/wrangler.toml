#:schema node_modules/wrangler/config-schema.json
# Wrangler configuration: https://developers.cloudflare.com/workers/wrangler/configuration/
#
# Every routed hostname needs a Proxied DNS record in the 1think2win.com zone. Set the secrets before deploying:
#   npx wrangler secret put CRON_SECRET                               (production)
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY                 (production)
#   npx wrangler secret put CRON_SECRET --env staging                 (staging)
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env staging   (staging)
# and create the queues once (README.md, "Lock-ins at the edge"):
#   npx wrangler queues create lockins           npx wrangler queues create lockins-dlq
#   npx wrangler queues create lockins-staging   npx wrangler queues create lockins-staging-dlq

name = "1think2win-edge"
main = "src/index.ts"
compatibility_date = "2026-10-06"
# account_id = "<id from `npx wrangler whoami`>"  # only needed if your login has several accounts
workers_dev = false
upload_source_maps = true

[limits]
cpu_ms = 50

# www redirects to the apex (a Redirect Rule, which runs before Workers), so only the apex is routed.
# Paths Cloudflare serves from its cache, and the webhooks, get routes without this Worker (README.md).
[[routes]]
pattern = "1think2win.com/api/*"
zone_name = "1think2win.com"

[vars]
SITE_URL = "https://1think2win.com"
# "false": log-only. Limits are counted and logged ("wouldLimit" in Workers Logs), never applied
ENFORCE = "false"
# "true": lock-ins (POST /api/quizzes/<id>/submit without X-Lockin-Direct: 1) and GET /api/csrf-token are answered
# here and never reach Hostinger; lock-ins are queued and saved to Supabase in batches. "false": they go to Hostinger.
LOCKIN_EDGE = "false"
# The project the app signs sessions with (its JWKS verifies them) and the consumer saves lock-ins to (Mumbai)
SUPABASE_URL = "https://eclivawqhdovsndlngfo.supabase.co"

[secrets]
required = ["CRON_SECRET", "SUPABASE_SERVICE_ROLE_KEY"]

# Every minute, replacing the app's in-process self-kick of /api/cron/process-scheduled
[triggers]
crons = ["* * * * *"]

# period must be 10 or 60 seconds; namespace_id is any positive integer, unique in the account.
# Starting values: tune them with the staging load test.
# SUBMIT_LIMITER and API_LIMITER are per session (per IP without one); IP_LIMITER is a ceiling per IP,
# high enough for a carrier NAT or campus Wi-Fi full of players.
[[ratelimits]]
name = "SUBMIT_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 10 }

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1003"
simple = { limit = 3000, period = 60 }

# Hostinger's budget, per Cloudflare location (one key): 60 API requests/s, under Hostinger's ~100/s with
# room for page requests. Players in Pakistan arrive mostly through KHI, a few through LHE and MCT.
[[ratelimits]]
name = "ORIGIN_LIMITER"
namespace_id = "1004"
simple = { limit = 600, period = 10 }

# Lock-ins accepted at the edge. Queues take 5,000 messages/s per queue. The consumer saves batches of up to 100
# through submit_lockin_batch; a failed batch is retried after 5 s, and after 20 tries goes to lockins-dlq.
[[queues.producers]]
binding = "LOCKIN_QUEUE"
queue = "lockins"

[[queues.consumers]]
queue = "lockins"
max_batch_size = 100
max_batch_timeout = 1
max_concurrency = 4
max_retries = 20
dead_letter_queue = "lockins-dlq"

# Lock-ins received per quiz, 16 shards each (GET /api/edge/lockin-status sums them)
[[durable_objects.bindings]]
name = "LOCKIN_TALLY"
class_name = "LockinTally"

# Migrations are shared by every environment
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LockinTally"]

[observability]
enabled = true

# Staging: vars, secrets and ratelimits are not inherited, so they are repeated here.
# Deploy with `npx wrangler deploy --env staging`.
[env.staging]
routes = [{ pattern = "staging.1think2win.com/api/*", zone_name = "1think2win.com" }]

[env.staging.vars]
SITE_URL = "https://staging.1think2win.com"
ENFORCE = "true"
LOCKIN_EDGE = "false"
# Never the production project: staging lock-ins would be saved to the live database. Put a test project's URL
# here (a Free org, so it costs nothing) before turning LOCKIN_EDGE on; until then this name doesn't resolve,
# so a staging lock-in fails at the session check (503) instead of reaching any database.
SUPABASE_URL = "https://set-a-staging-project.invalid"

# No cron until staging.1think2win.com has a DNS record: it would call a name that doesn't resolve every minute
[env.staging.triggers]
crons = []

[env.staging.secrets]
required = ["CRON_SECRET", "SUPABASE_SERVICE_ROLE_KEY"]

[[env.staging.queues.producers]]
binding = "LOCKIN_QUEUE"
queue = "lockins-staging"

[[env.staging.queues.consumers]]
queue = "lockins-staging"
max_batch_size = 100
max_batch_timeout = 1
max_concurrency = 4
max_retries = 20
dead_letter_queue = "lockins-staging-dlq"

[[env.staging.durable_objects.bindings]]
name = "LOCKIN_TALLY"
class_name = "LockinTally"

[[env.staging.ratelimits]]
name = "SUBMIT_LIMITER"
namespace_id = "2001"
simple = { limit = 10, period = 10 }

[[env.staging.ratelimits]]
name = "API_LIMITER"
namespace_id = "2002"
simple = { limit = 600, period = 60 }

# k6 sends every virtual user from the load machine's one IP, so the ceiling is out of the way here
[[env.staging.ratelimits]]
name = "IP_LIMITER"
namespace_id = "2003"
simple = { limit = 200000, period = 60 }

[[env.staging.ratelimits]]
name = "ORIGIN_LIMITER"
namespace_id = "2004"
simple = { limit = 600, period = 10 }
