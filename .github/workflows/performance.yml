name: ⚡ Performance Monitoring

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run every day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.x'

# One build (bundle-analysis), which the Lighthouse job downloads. There is no Playwright job here:
# no test is tagged @performance, so the old one reran the whole Chromium suite that tests.yml
# already runs, and was set never to fail. Add a job back when @performance tests exist.
jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build & Bundle Analysis
  # ──────────────────────────────────────────────
  bundle-analysis:
    name: 📦 Bundle Size Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'mongodb://localhost:27017/test' }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'test-secret-for-ci-only' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://test.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'test-anon-key' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production bundle
        run: bun run build
        env:
          CI: true
          ANALYZE: true

      - name: Analyze bundle sizes
        run: |
          echo "## 📦 Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d ".next" ]; then
            echo "### Next.js Build Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            # Get JS bundle sizes
            echo "JavaScript Bundles:" >> $GITHUB_STEP_SUMMARY
            find .next/static -name "*.js" -not -name "*.map" 2>/dev/null | \
              xargs ls -lh 2>/dev/null | \
              awk '{print $5, $9}' | \
              sort -rh | head -20 >> $GITHUB_STEP_SUMMARY || echo "No JS files found"

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "CSS Bundles:" >> $GITHUB_STEP_SUMMARY
            find .next/static -name "*.css" 2>/dev/null | \
              xargs ls -lh 2>/dev/null | \
              awk '{print $5, $9}' | \
              sort -rh >> $GITHUB_STEP_SUMMARY || echo "No CSS files found"

            echo '```' >> $GITHUB_STEP_SUMMARY

            # Total sizes
            JS_SIZE=$(find .next/static -name "*.js" -not -name "*.map" -exec du -sh {} + 2>/dev/null | tail -1 | awk '{print $1}' || echo "N/A")
            CSS_SIZE=$(find .next/static -name "*.css" -exec du -sh {} + 2>/dev/null | tail -1 | awk '{print $1}' || echo "N/A")
            TOTAL_SIZE=$(du -sh .next/static 2>/dev/null | awk '{print $1}' || echo "N/A")

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Bundle Type | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|-------------|------|" >> $GITHUB_STEP_SUMMARY
            echo "| JavaScript | $JS_SIZE |" >> $GITHUB_STEP_SUMMARY
            echo "| CSS | $CSS_SIZE |" >> $GITHUB_STEP_SUMMARY
            echo "| Total Static | $TOTAL_SIZE |" >> $GITHUB_STEP_SUMMARY
          fi

      # .next is a hidden folder, which upload-artifact skips: the old upload of `.next/` found no
      # files and uploaded nothing. Packed into one file, it is also far quicker to move. `next start`
      # reads neither the build cache nor the standalone copy, so both stay behind.
      - name: Pack the build
        run: tar --exclude=.next/cache --exclude=.next/standalone --exclude=.next/analyze -cf next-build.tar .next

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: next-build.tar
          if-no-files-found: error
          retention-days: 1

      # The interactive treemaps from ANALYZE=true (client.html, nodejs.html, edge.html)
      - name: Upload bundle analyzer report
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analyzer-report
          path: .next/analyze/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # ──────────────────────────────────────────────
  # Job 2: Lighthouse Performance Audit
  # ──────────────────────────────────────────────
  lighthouse:
    name: 🔦 Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: bundle-analysis
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'mongodb://localhost:27017/test' }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'test-secret-for-ci-only' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://test.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'test-anon-key' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js (for Lighthouse)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Unpack the build
        run: tar -xf next-build.tar && rm next-build.tar

      # lhci starts and stops the server itself (startServerCommand in .lighthouserc.json). This
      # workflow used to start one on port 3000 as well, so lhci's own failed with "address already
      # in use", and `|| true` hid that: no report was ever produced. A failure here now fails the job.
      # The home page only: the other pages in .lighthouserc.json need a database.
      - name: Run Lighthouse
        run: lhci collect --url=http://localhost:3000/ --numberOfRuns=3 --settings.chromeFlags="--no-sandbox"

      # The budgets in .lighthouserc.json. Reported, not enforced (as before): a miss is a warning
      - name: Check Lighthouse budgets
        run: lhci assert || echo "::warning::Lighthouse budgets in .lighthouserc.json were missed (not blocking); see the log above"

      - name: Save Lighthouse reports
        run: lhci upload --target=filesystem --outputDir=./lighthouse-results

      - name: Process Lighthouse results
        run: node .github/ci/lighthouse-summary.mjs lighthouse-results

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-results/
          retention-days: 14

  # ──────────────────────────────────────────────
  # Job 3: Performance summary comment on the pull request
  # ──────────────────────────────────────────────
  performance-regression:
    name: 📉 Regression Check
    runs-on: ubuntu-latest
    needs: [bundle-analysis, lighthouse]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const bundleStatus = '${{ needs.bundle-analysis.result }}';
            const lighthouseStatus = '${{ needs.lighthouse.result }}';

            const statusEmoji = (s) => s === 'success' ? '✅' : s === 'failure' ? '❌' : '⚠️';

            const body = `## ⚡ Performance Analysis

            | Check | Status |
            |-------|--------|
            | Bundle Analysis | ${statusEmoji(bundleStatus)} ${bundleStatus} |
            | Lighthouse Audit | ${statusEmoji(lighthouseStatus)} ${lighthouseStatus} |

            > Bundle sizes and Lighthouse scores are in the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) summary.
            `;

            // Update our previous comment instead of posting a new one on every push
            const marker = '## ⚡ Performance Analysis';
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
