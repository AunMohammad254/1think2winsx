name: 📈 Coverage Reports

# Not on pull requests: the unit job in tests.yml is the one coverage run there (results, the 100%
# gate and the coverage comment). This workflow keeps the badge and the published report current.
on:
  push:
    branches: [main, master]
  schedule:
    # Run every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.x'

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Generate Coverage Report
  # ──────────────────────────────────────────────
  generate-coverage:
    name: 📊 Generate Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'mongodb://localhost:27017/test' }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'test-secret-for-ci-only' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://test.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'test-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'test-service-key' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch full history for accurate coverage tracking
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run full test suite with coverage
        run: bun run test:coverage -- --reporter=verbose
        env:
          CI: true

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: coverage/
          retention-days: 30

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/coverage-final.json
          flags: unittests
          name: 1think2wins-coverage
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # The same gate as the unit job in tests.yml: 100% on lines, statements, functions and
      # branches, naming the files that fall short. It also writes the job summary.
      - name: Check coverage thresholds
        run: node .github/ci/coverage-gate.mjs

  # ──────────────────────────────────────────────
  # Job 2: Generate Coverage Badge
  # ──────────────────────────────────────────────
  update-badge:
    name: 🏅 Update Coverage Badge
    runs-on: ubuntu-latest
    needs: generate-coverage
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: html-coverage-report
          path: coverage/

      - name: Extract coverage percentage
        id: coverage
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            PCT=$(python3 -c "
          import json
          with open('coverage/coverage-summary.json') as f:
              d = json.load(f)
          print(round(d.get('total', {}).get('lines', {}).get('pct', 0), 1))
          ")
            echo "percentage=$PCT" >> $GITHUB_OUTPUT
            echo "Coverage: $PCT%"
          else
            echo "percentage=0" >> $GITHUB_OUTPUT
          fi

      - name: Create coverage badge JSON
        run: |
          PCT="${{ steps.coverage.outputs.percentage }}"
          if (( $(echo "$PCT >= 90" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$PCT >= 80" | bc -l) )); then
            COLOR="green"
          elif (( $(echo "$PCT >= 70" | bc -l) )); then
            COLOR="yellow"
          elif (( $(echo "$PCT >= 60" | bc -l) )); then
            COLOR="orange"
          else
            COLOR="red"
          fi

          mkdir -p .github/badges
          cat > .github/badges/coverage.json << EOF
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "${PCT}%",
            "color": "${COLOR}"
          }
          EOF
          echo "Badge generated: ${PCT}% (${COLOR})"

      - name: Upload badge artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: .github/badges/coverage.json
          retention-days: 90

  # ──────────────────────────────────────────────
  # Job 3: Publish Coverage Report to GitHub Pages
  # ──────────────────────────────────────────────
  publish-coverage:
    name: 🌐 Publish Coverage Report
    runs-on: ubuntu-latest
    needs: generate-coverage
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: html-coverage-report
          path: coverage/

      - name: Setup Pages
        uses: actions/configure-pages@v4
        continue-on-error: true

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: coverage/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
