name: 🧪 Test Suite

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - e2e
          - api

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# publish-unit-test-result-action and the coverage comment need checks + PR write access
permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  BUN_VERSION: '1.x'

# Every job starts at once. The app is built once (job `build`) and the four browser jobs download
# that build; only the quiz job builds its own, because its Supabase address is baked into the build.
jobs:
  # ──────────────────────────────────────────────
  # Job 1: Lint & Type Check
  # ──────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Generate ESLint JSON report
        if: always()
        run: bun run lint --format=json --output-file=eslint-report.json || true

      - name: TypeScript type check
        run: bunx tsc --noEmit

      - name: Upload ESLint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 7

  # ──────────────────────────────────────────────
  # Job 2: Unit & API Tests (Vitest) + the coverage gate
  # The one coverage run for a pull request: test results, the 100% gate and the coverage comment.
  # coverage.yml repeats it only on main and nightly, for the badge and the published report.
  # ──────────────────────────────────────────────
  unit-tests:
    name: 🧬 Unit & API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'mongodb://localhost:27017/test' }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'test-secret-for-ci-only' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://test.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'test-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'test-service-key' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests with coverage
        run: bun run test:coverage --reporter=verbose --reporter=junit --outputFile.junit=test-results/junit.xml
        env:
          CI: true

      # Fails when a line, statement, function or branch of src/ is uncovered, and names the files.
      # It also writes coverage/pr-comment.md for the comment step below.
      - name: Check coverage thresholds
        run: node .github/ci/coverage-gate.mjs

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload JUnit XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/junit.xml
          retention-days: 14

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && !cancelled()
        with:
          files: test-results/junit.xml
          check_name: Unit & API Test Results
          comment_title: 🧬 Unit & API Test Results
          fail_on: test failures

      # One comment per pull request, updated on each push. A fork's token cannot comment, so skip it there
      - name: Post PR coverage comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: >-
          always() && !cancelled() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('coverage/pr-comment.md') != ''
        with:
          header: coverage-report
          path: coverage/pr-comment.md

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage/coverage-final.json
          flags: unit
          name: unit-coverage
          fail_ci_if_error: false

  # ──────────────────────────────────────────────
  # Job 2b: Database Tests (Postgres functions + RLS)
  # Real SQL against a throwaway Postgres service container, never a Supabase project.
  # Separate Vitest config (db-tests/vitest.config.ts): no coverage, so the unit
  # thresholds above are unaffected. See db-tests/README.md.
  # ──────────────────────────────────────────────
  db-tests:
    name: 🗄️ Database Tests (Postgres + RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Same major version as the Supabase project
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_TEST_URL: postgres://postgres:postgres@localhost:54329/postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run database tests
        run: bun run test:db
        env:
          CI: true

      # The storage rules for receipts and media (supabase/tests/*.test.sql), in a second throwaway
      # Postgres container of their own: see the script for why they cannot share the one above
      - name: Run storage SQL tests
        if: always() && !cancelled()
        run: bash .github/ci/storage-sql-tests.sh

      - name: Upload JUnit XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-test-results
          path: test-results/db-junit.xml
          retention-days: 14

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && !cancelled()
        with:
          files: test-results/db-junit.xml
          check_name: Database Test Results
          comment_title: 🗄️ Database Test Results
          fail_on: test failures

  # ──────────────────────────────────────────────
  # Job 2c: Edge Worker Tests (Cloudflare)
  # edge-shield is its own npm package: the Worker in front of /api/* (rate limits, the lock-in
  # queue and tally). Its tests run inside workerd through @cloudflare/vitest-plugin.
  # ──────────────────────────────────────────────
  edge-tests:
    name: 🛡️ Edge Worker Tests (Cloudflare)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: edge-shield
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: edge-shield/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript type check (Worker)
        run: npx tsc --noEmit

      - name: TypeScript type check (tests)
        run: npx tsc --noEmit -p test

      - name: Run Worker tests
        run: npx vitest run --reporter=verbose --reporter=junit --outputFile.junit=../test-results/edge-junit.xml
        env:
          CI: true

      - name: Upload JUnit XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-test-results
          path: test-results/edge-junit.xml
          retention-days: 14

  # ──────────────────────────────────────────────
  # Job 3: Build once for the four browser jobs
  # They used to build the same commit four times. The build is packed into one file because
  # .next is a hidden folder (upload-artifact skips those) holding thousands of small files.
  # ──────────────────────────────────────────────
  build:
    name: 🏗️ Build (for the E2E jobs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'mongodb://localhost:27017/test' }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'test-secret-for-ci-only' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://test.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'test-anon-key' }}
      # Cloudflare's always-pass Turnstile key, so the test browsers never load the live widget.
      # Next.js bakes it into the build, so it is set here and not only where the server starts
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build
        env:
          CI: true

      # `next start` reads neither the build cache (about 800 MB) nor the standalone copy (about 90 MB)
      - name: Pack the build
        run: tar --exclude=.next/cache --exclude=.next/standalone -cf next-build.tar .next

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: next-build.tar
          if-no-files-found: error
          retention-days: 1

  # ──────────────────────────────────────────────
  # Job 4: E2E Tests - Chromium
  # ──────────────────────────────────────────────
  e2e-chromium:
    name: 🌐 E2E Tests (Chromium)
    runs-on: ubuntu-latest
    # Playwright stops itself after 15 minutes (globalTimeout in playwright.config.ts) and still
    # writes its report; this limit is only the backstop
    timeout-minutes: 25
    needs: build
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'mongodb://localhost:27017/test' }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'test-secret-for-ci-only' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://test.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'test-anon-key' }}
      # Cloudflare's always-pass Turnstile key, so the test browsers never load the live widget
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      # .github/ci/playwright-install.sh: 5 minutes a try, 3 tries (apt-get sometimes crawls)
      - name: Install Playwright Chromium
        run: bash .github/ci/playwright-install.sh install chromium --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system deps
        run: bash .github/ci/playwright-install.sh install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Unpack the build
        run: tar -xf next-build.tar && rm next-build.tar

      - name: Run Playwright E2E tests (Chromium)
        run: bunx playwright test --project=chromium --reporter=html,junit
        env:
          CI: true
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/e2e-chromium-junit.xml

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-chromium
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-chromium
          path: test-results/
          retention-days: 7

      - name: Upload JUnit XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-chromium-results
          path: test-results/e2e-chromium-junit.xml
          retention-days: 14

  # ──────────────────────────────────────────────
  # Job 5: E2E Tests - Firefox
  # ──────────────────────────────────────────────
  e2e-firefox:
    name: 🦊 E2E Tests (Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'mongodb://localhost:27017/test' }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'test-secret-for-ci-only' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://test.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'test-anon-key' }}
      # Cloudflare's always-pass Turnstile key, so the test browsers never load the live widget
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-firefox-${{ hashFiles('bun.lock') }}

      - name: Install Playwright Firefox
        run: bash .github/ci/playwright-install.sh install firefox --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system deps
        run: bash .github/ci/playwright-install.sh install-deps firefox
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Unpack the build
        run: tar -xf next-build.tar && rm next-build.tar

      - name: Run Playwright E2E tests (Firefox)
        run: bunx playwright test --project=firefox --reporter=html,junit
        env:
          CI: true
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/e2e-firefox-junit.xml

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-firefox
          path: playwright-report/
          retention-days: 14

      - name: Upload JUnit XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-firefox-results
          path: test-results/e2e-firefox-junit.xml
          retention-days: 14

  # ──────────────────────────────────────────────
  # Job 6: E2E Tests - WebKit (Safari)
  # ──────────────────────────────────────────────
  e2e-webkit:
    name: 🍎 E2E Tests (WebKit)
    # Pinned: Playwright 1.64's WebKit is built for Ubuntu 24.04 and needs its ICU 74
    # (libicudata.so.74). ubuntu-latest is moving to 26.04, which doesn't have it, so WebKit
    # failed to launch on every test there.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: build
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'mongodb://localhost:27017/test' }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'test-secret-for-ci-only' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://test.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'test-anon-key' }}
      # Cloudflare's always-pass Turnstile key, so the test browsers never load the live widget
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ hashFiles('bun.lock') }}

      - name: Install Playwright WebKit
        run: bash .github/ci/playwright-install.sh install webkit --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system deps
        run: bash .github/ci/playwright-install.sh install-deps webkit
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Unpack the build
        run: tar -xf next-build.tar && rm next-build.tar

      # One at a time here (the other browser jobs run two): WebKit's scroll tests are timing-sensitive
      # and already needed a retry in about 1 run in 4; with two workers that became about every run
      - name: Run Playwright E2E tests (WebKit)
        run: bunx playwright test --project=webkit --workers=1 --reporter=html,junit
        env:
          CI: true
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/e2e-webkit-junit.xml

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-webkit
          path: playwright-report/
          retention-days: 14

      - name: Upload JUnit XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-webkit-results
          path: test-results/e2e-webkit-junit.xml
          retention-days: 14

  # ──────────────────────────────────────────────
  # Job 7: Mobile Browser Tests
  # ──────────────────────────────────────────────
  e2e-mobile:
    name: 📱 E2E Tests (Mobile)
    # Pinned for Mobile Safari (WebKit), as e2e-webkit is
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: build
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'mongodb://localhost:27017/test' }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'test-secret-for-ci-only' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://test.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'test-anon-key' }}
      # Cloudflare's always-pass Turnstile key, so the test browsers never load the live widget
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-mobile-${{ hashFiles('bun.lock') }}

      - name: Install Playwright mobile browsers
        run: bash .github/ci/playwright-install.sh install chromium webkit --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system deps
        run: bash .github/ci/playwright-install.sh install-deps chromium webkit
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Unpack the build
        run: tar -xf next-build.tar && rm next-build.tar

      - name: Run mobile E2E tests
        run: bunx playwright test --project="Mobile Chrome" --project="Mobile Safari" --reporter=html,junit
        env:
          CI: true
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/e2e-mobile-junit.xml

      - name: Upload Playwright mobile report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-mobile
          path: playwright-report/
          retention-days: 14

      - name: Upload JUnit XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-mobile-results
          path: test-results/e2e-mobile-junit.xml
          retention-days: 14

  # ──────────────────────────────────────────────
  # Job 8: E2E Quiz Flow (local Supabase stack)
  # e2e/play-quiz.spec.ts: a real browser plays a live quiz against a real database, Auth server
  # and API, then the admin saves the result and settles it. The stack runs in Docker on the
  # runner (e2e/README.md), never against a hosted project. This job builds the app itself: the
  # stack's address and keys are baked into that build.
  # ──────────────────────────────────────────────
  e2e-quiz:
    name: 🎯 E2E Quiz Flow (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # e2e/stack/stack.mjs runs the Supabase CLI through npx
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The same cache as e2e-chromium (same runner image, same browser)
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Install Playwright Chromium
        run: bash .github/ci/playwright-install.sh install chromium --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system deps
        run: bash .github/ci/playwright-install.sh install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Start the local Supabase stack
        run: node e2e/stack/stack.mjs up

      # With CI set, playwright.stack.config.ts refuses to run without the stack, so this step
      # cannot pass by skipping the test
      - name: Run the quiz E2E test
        run: bun run test:e2e:quiz
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-quiz
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-quiz
          path: test-results/quiz-e2e/
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: node e2e/stack/stack.mjs down || true

  # ──────────────────────────────────────────────
  # Job 9: Summary & Notifications
  # ──────────────────────────────────────────────
  report-summary:
    name: 📊 Report & Notify
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, db-tests, edge-tests, build, e2e-chromium, e2e-firefox, e2e-webkit, e2e-mobile, e2e-quiz]
    if: always()
    # `secrets` is not allowed in `if:` expressions, so expose it via env and test that instead
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
    steps:
      - name: Generate combined summary
        env:
          RESULTS: |
            🔍 Lint & Type Check=${{ needs.lint.result }}
            🧬 Unit & API Tests + coverage gate=${{ needs.unit-tests.result }}
            🗄️ Database + storage SQL Tests=${{ needs.db-tests.result }}
            🛡️ Edge Worker Tests=${{ needs.edge-tests.result }}
            🏗️ Build=${{ needs.build.result }}
            🌐 E2E Chromium=${{ needs.e2e-chromium.result }}
            🦊 E2E Firefox=${{ needs.e2e-firefox.result }}
            🍎 E2E WebKit=${{ needs.e2e-webkit.result }}
            📱 E2E Mobile=${{ needs.e2e-mobile.result }}
            🎯 E2E Quiz Flow=${{ needs.e2e-quiz.result }}
        run: |
          {
            echo "## 🧪 1Think2Wins Test Suite Results"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            while IFS='=' read -r job result; do
              [ -n "$job" ] || continue
              case "$result" in
                success)   status='✅ Passed' ;;
                failure)   status='❌ Failed' ;;
                cancelled) status='🚫 Cancelled' ;;
                *)         status='⏭️ Skipped' ;;
              esac
              echo "| $job | $status |"
            done <<< "$RESULTS"
            echo ""
            echo "**Commit:** ${{ github.sha }}"
            echo "**Branch:** ${{ github.ref_name }}"
            echo "**Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack on failure
        if: |
          failure() &&
          github.ref == 'refs/heads/main' &&
          env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "❌ *1Think2Wins CI Failed* on `${{ github.ref_name }}`",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "❌ Test Suite Failed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Repository:*\n${{ github.repository }}"},
                    {"type": "mrkdwn", "text": "*Branch:*\n${{ github.ref_name }}"},
                    {"type": "mrkdwn", "text": "*Commit:*\n${{ github.sha }}"},
                    {"type": "mrkdwn", "text": "*Triggered by:*\n${{ github.actor }}"}
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {"type": "plain_text", "text": "View Run"},
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

      - name: Notify Slack on success
        if: |
          success() &&
          github.ref == 'refs/heads/main' &&
          env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "✅ *1Think2Wins CI Passed* on `${{ github.ref_name }}`",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "✅ All Tests Passed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Repository:*\n${{ github.repository }}"},
                    {"type": "mrkdwn", "text": "*Branch:*\n${{ github.ref_name }}"},
                    {"type": "mrkdwn", "text": "*Commit:*\n${{ github.sha }}"}
                  ]
                }
              ]
            }
